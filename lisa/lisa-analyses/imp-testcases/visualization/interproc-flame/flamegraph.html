<!doctype html>
<html>

<head>
	<title>Analysis Flame Graph</title>

	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1" />

	<script src="assets/d3.v7.min.js"></script>
	<script src="assets/d3-graphviz.min.js"></script>
	<link rel="stylesheet" href="assets/style.css">
	</link>
</head>

<body>
	<div class="box">
		<header class="row header" id="lisa-header">
			<img src="https://raw.githubusercontent.com/lisa-analyzer/lisa/master/logo.png" alt="LiSA logo" />
			<h1>Analysis Flame Graph</h1>
			<input id="search" type="text" class="searchbar" placeholder="Search node..." />
			<input id="next" type="button" value="Next" class="button" disabled />
			<input id="prev" type="button" value="Previous" class="button" disabled />
			<button id="legendButton" class="button">Legend</button>
		</header>
		<div id="legend" class="modal">
			<div class="modal-content">
				<span class="close">&times;</span>
				<b>Interprocedural event: <font color="red">red</font></b>
				<b>Fixpoint event: <font color="blue">blue</font></b>
				<b>Analysis event: <font color="green">green</font></b>
				<b>Domain event: <font color="#d3d609">yellow</font></b>
				<b>The lighter the color, the shorter the execution time</b>
			</div>
		</div>
		<div id="overview-map-container">
			<svg id="overview-map"></svg>
		</div>
		<div id="heatmap-chart"></div>
		<div class="heatmap-tooltip" id="heatmap-tooltip"></div>
	</div>
	<script>
		/*<![CDATA[*/
		const graph = "{\"children\":[{\"children\":[{\"children\":[{\"children\":[],\"end_ns\":\"968053\",\"start_ns\":\"789935\",\"text\":\"Fixpoint of untyped A::A(A*)\"},{\"children\":[],\"end_ns\":\"2768179\",\"start_ns\":\"1422957\",\"text\":\"Fixpoint of untyped A::getOne(A*)\"},{\"children\":[],\"end_ns\":\"3805299\",\"start_ns\":\"3222120\",\"text\":\"Fixpoint of untyped A::getPositive(A*, untyped)\"},{\"children\":[],\"end_ns\":\"4631252\",\"start_ns\":\"4446649\",\"text\":\"Fixpoint of untyped A::identity(A*, untyped)\"},{\"children\":[],\"end_ns\":\"5463315\",\"start_ns\":\"5284659\",\"text\":\"Fixpoint of untyped A::identity(A*, untyped)\"},{\"children\":[{\"children\":[],\"end_ns\":\"6551562\",\"start_ns\":\"6394903\",\"text\":\"Fixpoint of untyped A::identity(A*, untyped)\"}],\"end_ns\":\"6739014\",\"start_ns\":\"6072925\",\"text\":\"Fixpoint of untyped tests::helper(tests*, untyped, untyped)\"}],\"end_ns\":\"6940078\",\"start_ns\":\"329710\",\"text\":\"Fixpoint of untyped tests::main(tests*)\"}],\"end_ns\":\"7552192\",\"start_ns\":\"76784\",\"text\":\"Program-wide fixpoint iteration 1\"}],\"end_ns\":\"7577090\",\"start_ns\":\"0\",\"text\":\"Program-wide fixpoint\"}";
		/*]]>*/

		// ---------------------------------------------------------------
		// FLATTENING THE GRAPH FOR POPULATING THE NODES LIST
		// ---------------------------------------------------------------
		const nodes = [];
		function walk(node, depth = 0) {
			const text = String(node.text);
			const start = Number(node.start_ns);
			const end = Number(node.end_ns);
			if (!Number.isFinite(start) || !Number.isFinite(end) || end < start) {
				console.log("Discarding data at depth " + depth + " (" + text + "): invalid start or end time. Graph will be incomplete.");
				console.log("start: " + start + ", end: " + end);
				return;
			}

			const duration = end - start;
			let kind;
			if (text.startsWith("Analysis:")) kind = "Analysis";
			else if (text.match(/^[a-zA-Z0-9_]+:/)) kind = "Domain";
			else if (text.toLowerCase().includes("fixpoint")) kind = "Interprocedural";
			else kind = "Fixpoint";

			nodes.push({text, start, end, duration, kind, depth});
			for (const c of node.children || []) walk(c, depth + 1);
		}
		walk(JSON.parse(graph));

		// ---------------------------------------------------------------
		// CONSTANTS AND SETUP
		// ---------------------------------------------------------------
		let width = window.innerWidth;
		const headerHeight = document.getElementById("lisa-header").offsetHeight;
		const overviewHeight = 100;
		let height = window.innerHeight - headerHeight - overviewHeight - 5;
		const rowHeight = 22;
		let overviewRowHeight = Math.max(2, rowHeight * overviewHeight / height);
		const axisHeight = 24;
		const minTime = d3.min(nodes, d => d.start);
		const maxTime = d3.max(nodes, d => d.end);
		const xScale = d3.scaleLinear()
			.domain([minTime, maxTime])
			.range([0, width]);
		const scrollZoomSpeed = 1.1;

		// ---------------------------------------------------------------
		// MAIN SVG AND LAYERS
		// ---------------------------------------------------------------
		const overviewSvg = d3.select("#overview-map")
			.attr("width", width)
			.attr("height", overviewHeight);
		const svg = d3.select("#heatmap-chart")
			.append("svg")
			.attr("width", width)
			.attr("height", height);

		const zoomLayer = svg.append("g")
			.attr("transform", `translate(0, ${axisHeight})`);

		// ---------------------------------------------------------------
		// BUILDING THE AXIS AND GRID TO DRAW ON TOP OF THE GRAPH 
		// ---------------------------------------------------------------
		function formatAxisTicks(d) {
			// d is nanoseconds offset from minTime
			const ms = (d - minTime) / 1e6;
			if (ms < 1) return ((d - minTime) / 1e3).toFixed(0) + " μs";
			if (ms < 1000) return ms.toFixed(0) + " ms";
			const s = ms / 1000;
			if (s < 60) return s.toFixed(2) + " s";
			const m = Math.floor(s / 60);
			const sec = s % 60;
			if (m < 60) return `${m}m ${sec.toFixed(1)}s`;
			const h = Math.floor(m / 60);
			const min = m % 60;
			return `${h}h ${min}m`;
		}
		const axis = d3.axisTop(xScale)
			.ticks(Math.max(5, width / 180))
			.tickFormat(formatAxisTicks);
		// white background behind the axis to prevent the graph from overflowing in the axis
		const axisBG = svg.append("rect")
			.attr("id", "axis-bg")
			.attr("x", 0)
			.attr("y", 0)
			.attr("width", width)
			.attr("height", axisHeight);
		const axisGroup = svg.append("g")
			.attr("transform", `translate(0,${axisHeight})`)
			.call(axis);
		// drawing grid lines based on the visible ticks
		function drawGridLines(currentScale) {
			axisGroup.selectAll(".grid-line").remove();
			axisGroup.selectAll(".tick").each(function (d) {
				axisGroup.append("line")
					.attr("class", "grid-line")
					.attr("x1", currentScale(d))
					.attr("x2", currentScale(d))
					.attr("y1", 0)
					.attr("y2", height);
			});
		}
		drawGridLines(xScale);

		// ---------------------------------------------------------------
		// CONFIGURING ZOOM AND PAN BEHAVIOR
		// ---------------------------------------------------------------
		const zoom = d3.zoom()
			// min zoom of 1 (cannot reduce graph size), max zoom of 100 (arbitrary, can be adjusted)
			.scaleExtent([1, 100])
			.on("zoom", (event) => {
				const t = event.transform;
				const scale = t.k;

				// set up clamping so we cannot pan the graph out of view
				const maxX = 0;
				const maxY = 0;
				const minX = Math.min(width - width * scale, 0);
				const minY = Math.min(height - height * scale, 0);
				const clampedX = Math.max(Math.min(t.x, maxX), minX);
				const clampedY = Math.max(Math.min(t.y, maxY), minY);
				const clamped = t.x !== clampedX || t.y !== clampedY;

				// apply zoom and pan: always offset by the axis height
				zoomLayer.attr("transform", `translate(${clampedX},${clampedY + axisHeight}) scale(${scale})`);
				// clamp the transform on the zoom layer as well:
				// otherwise the transforms would be inconsistent 
				// and the panning would break 
				if (clamped)
					svg.call(zoom.transform, d3.zoomIdentity.translate(clampedX, clampedY).scale(scale));

				// zoom and pan the axis as well
				const newTransform = d3.zoomIdentity.translate(clampedX, 0).scale(scale);
				const newX = newTransform.rescaleX(xScale);
				const domain = newX.domain();
				if (domain[0] < minTime || domain[1] > maxTime) {
					// if out of bounds, reset axis to [minTime, maxTime]
					axisGroup.call(axis.scale(xScale));
					drawGridLines(xScale);
				} else {
					axisGroup.call(axis.scale(newX));
					drawGridLines(newX);
				}

				// update the labels that are visible inside each bar in the graph
				updateLabels();
				// update the viewport rectangle in the overview map
				updateOverviewViewport();
			});
		svg.call(zoom);

		// ---------------------------------------------------------------
		// SCROLL WITH WHEEL, ZOOM WITH CTRL + WHEEL
		// ---------------------------------------------------------------
		svg.on("wheel.zoom", null);
		svg.on("wheel.custom", function (event) {
			event.preventDefault();
			if (event.ctrlKey) {
				d3.select(this).call(
					zoom.scaleBy,
					event.deltaY < 0 ? scrollZoomSpeed : 1 / scrollZoomSpeed,
					[event.offsetX, event.offsetY]
				);
			} else {
				d3.select(this).call(
					zoom.translateBy,
					-event.deltaX,
					-event.deltaY
				);
			}
		});

		// ---------------------------------------------------------------
		// LOGIC FOR MOVING THE TOOLTIP AROUND ON NODE HOVER
		// ---------------------------------------------------------------
		const tooltip = d3.select("#heatmap-tooltip");
		function showTooltip(event, d) {
			tooltip
				.style("opacity", 1)
				.html(`<b>${d.text}</b><br/>${(d.duration / 1e6).toFixed(2)} ms<br/>Kind: ${d.kind}`);

			moveTooltip(event);
		}
		function moveTooltip(event) {
			const pad = 12;
			const w = tooltip.node().offsetWidth;
			const h = tooltip.node().offsetHeight;

			let x = event.pageX + pad;
			let y = event.pageY + pad;

			if (x + w > window.innerWidth) x = event.pageX - w - pad;
			if (y + h > window.innerHeight) y = event.pageY - h - pad;

			tooltip.style("left", x + "px").style("top", y + "px");
		}
		function hideTooltip() {
			tooltip.style("opacity", 0);
		}

		// ---------------------------------------------------------------
		// MAIN LOGIC FOR DRAWING THE HEATMAP GRAPH
		// ---------------------------------------------------------------
		const categoryHue = {
			Interprocedural: 0, // red
			Fixpoint: 210,      // blue
			Analysis: 120,      // green
			Domain: 60,         // yellow
			unknown: 0
		};
		const durationByKind = d3.group(nodes, d => d.kind);
		const scalesByKind = new Map(
			Array.from(durationByKind, ([kind, arr]) => [
				kind,
				d3.scaleLinear()
					.domain(d3.extent(arr, d => d.duration))
					.range([90, 40])
			])
		);
		function nodeColor(d) {
			const hue = categoryHue[d.kind] ?? categoryHue.unknown;
			const scale = scalesByKind.get(d.kind);
			return `hsl(${hue}, 70%, ${scale(d.duration)}%)`;
		}
		const rects = zoomLayer.selectAll("rect")
			.data(nodes)
			.enter()
			.append("rect")
			.attr("class", "heatmap-node")
			.attr("x", d => xScale(d.start))
			.attr("y", d => d.depth * rowHeight)
			.attr("width", d => xScale(d.end) - xScale(d.start))
			.attr("height", rowHeight - 2)
			.attr("fill", nodeColor)
			.on("mouseenter", showTooltip)
			.on("mousemove", moveTooltip)
			.on("mouseleave", hideTooltip);

		// ---------------------------------------------------------------
		// LABELS TO DISPLAY INSIDE EACH NODE, HIDDEN IF TOO LONG
		// ---------------------------------------------------------------
		const labels = zoomLayer.selectAll("text")
			.data(nodes)
			.enter()
			.append("text")
			.attr("class", "heatmap-label")
			.attr("x", d => xScale(d.start) + 4)
			.attr("y", d => d.depth * rowHeight + rowHeight * 0.7)
			.text(d => d.text)
			.on("mouseenter", showTooltip)
			.on("mousemove", moveTooltip)
			.on("mouseleave", hideTooltip);
		labels.each(function (d) {
			d._textWidth = this.getBBox().width;
		});

		function updateLabels() {
			labels.each(function (d) {
				const text = d3.select(this);
				const rectScreenWidth = xScale(d.end) - xScale(d.start);
				text.style("display", d._textWidth + 6 < rectScreenWidth ? null : "none");
			});
		}
		updateLabels();

		// ---------------------------------------------------------------
		// DRAWING THE OVERVIEW MAP
		// ---------------------------------------------------------------
		const overviewRects = overviewSvg.selectAll("rect")
			.data(nodes)
			.enter()
			.append("rect")
			.attr("class", "overview-node")
			.attr("x", d => xScale(d.start))
			.attr("y", d => d.depth * overviewRowHeight)
			.attr("width", d => xScale(d.end) - xScale(d.start))
			.attr("height", overviewRowHeight - 1)
			.attr("fill", nodeColor);

		const mask = overviewSvg.append("defs")
			.append("mask")
			.attr("id", "overview-mask");
		mask.append("rect")
			.attr("x", 0)
			.attr("y", 0)
			.attr("width", width)
			.attr("height", overviewHeight)
			.attr("fill", "white");
		const maskHole = mask.append("rect")
			.attr("id", "overview-mask-hole")
			.attr("x", 0)
			.attr("y", 0)
			.attr("width", 10)
			.attr("height", overviewHeight)
			.attr("fill", "black");
		const overlay = overviewSvg.append("rect")
			.attr("id", "overview-overlay")
			.attr("x", 0)
			.attr("y", 0)
			.attr("width", width)
			.attr("height", overviewHeight)
			.attr("mask", "url(#overview-mask)");
		const overviewViewport = overviewSvg.append("rect")
			.attr("id", "overview-viewport")
			.attr("x", 0)
			.attr("y", 0)
			.attr("width", 10)
			.attr("height", overviewHeight);

		function updateOverviewViewport() {
			const t = d3.zoomTransform(svg.node());
			const scale = t.k;
			const tx = t.x;
			const ty = t.y;

			const visibleMin = xScale.invert(-tx / scale);
			const visibleMax = xScale.invert((width - tx) / scale);
			const x1 = xScale(Math.max(minTime, visibleMin));
			const x2 = xScale(Math.min(maxTime, visibleMax));

			const mainGraphHeight = height;
			const visibleYMin = -ty / scale;
			const visibleYMax = (mainGraphHeight - ty) / scale;
			const y1 = Math.max(0, visibleYMin / mainGraphHeight * overviewHeight);
			const y2 = Math.min(overviewHeight, visibleYMax / mainGraphHeight * overviewHeight);

			overviewViewport
				.attr("x", x1)
				.attr("width", Math.max(10, x2 - x1))
				.attr("y", y1)
				.attr("height", Math.max(5, y2 - y1));
			overviewSvg.select("#overview-mask-hole")
				.attr("x", x1)
				.attr("y", y1)
				.attr("width", Math.max(10, x2 - x1))
				.attr("height", Math.max(5, y2 - y1));
			overlay
				.attr("width", width)
				.attr("height", overviewHeight);
		}
		updateOverviewViewport();

		// ---------------------------------------------------------------
		// LISTENING FOR RESIZE EVENTS
		// ---------------------------------------------------------------
		window.addEventListener("resize", () => {
			width = window.innerWidth;
			height = window.innerHeight - headerHeight - overviewHeight - 5;
			overviewRowHeight = Math.max(2, rowHeight * overviewHeight / height);

			xScale.range([0, width]);
			svg.attr("width", width).attr("height", height);
			overviewSvg.attr("width", width);

			// Update axis and grid
			axis.ticks(Math.max(5, width / 180));
			axisGroup.call(axis.scale(xScale));
			drawGridLines(xScale);

			// Update main graph rectangles and labels
			rects
				.attr("x", d => xScale(d.start))
				.attr("width", d => xScale(d.end) - xScale(d.start))
				.attr("y", d => d.depth * rowHeight)
				.attr("height", rowHeight - 2);
			labels
				.attr("x", d => xScale(d.start) + 4)
				.attr("y", d => d.depth * rowHeight + rowHeight * 0.7);
			overviewRects
				.attr("x", d => xScale(d.start))
				.attr("width", d => xScale(d.end) - xScale(d.start))
				.attr("y", d => d.depth * overviewRowHeight)
				.attr("height", overviewRowHeight - 1);

			axisBG.attr("width", width);

			updateLabels();
			updateOverviewViewport();
			svg.call(zoom.transform, d3.zoomTransform(svg.node()));
		});

		// ---------------------------------------------------------------
		// SEARCH TO FIND NODES BY TEXT
		// ---------------------------------------------------------------
		d3.select("#search").node().value = "";
		var hits = [];
		var hit = -1;
		function centerToSearch() {
			rects.classed("heatmap-highlight", false);
			const idx = hits[hit];
			rects.filter((_, j) => j === idx).classed("heatmap-highlight", true);

			const n = nodes[idx];
			const cx = (xScale(n.start) + xScale(n.end)) / 2;
			const cy = n.depth * rowHeight;

			svg.transition().duration(300).call(
				zoom.transform,
				d3.zoomIdentity
					.translate(width / 2 - cx, height / 2 - cy)
					.scale(1.5)
			);
		}
		d3.select("#search").on("input", function (e) {
			var query = e.target.value.toLowerCase();
			hits = [];
			if (query !== "")
				nodes.forEach((n, i) => {
					if (n.text.toLowerCase().includes(query)) hits.push(i);
				});
			rects.classed("heatmap-highlight", false);
			if (query === "" || hits.length == 0) {
				hit = -1;
				d3.select("#next").attr("disabled", true);
				d3.select("#prev").attr("disabled", true);
				d3.select(this).classed("no-results", true);
			} else {
				hit = 0;
				d3.select("#next").attr("disabled", null);
				d3.select("#prev").attr("disabled", null);
				d3.select(this).classed("no-results", false);
				centerToSearch();
			}
		});
		d3.select("#next").on("click", function (e) {
			if (hit != -1) {
				hit = (hit + 1) % hits.length;
				centerToSearch();
			}
		});
		d3.select("#prev").on("click", function (e) {
			if (hit != -1) {
				hit = (hit - 1 + hits.length) % hits.length;
				centerToSearch();
			}
		});

		// ---------------------------------------------------------------
		// LEGEND MODAL LOGIC
		// ---------------------------------------------------------------
		var modal = d3.select("#legend").on("click", function () {
			d3.select(this).style("display", "none");
		});
		var btn = d3.select("#legendButton").on("click", function () {
			modal.style("display", "block");
		});
		var span = d3.select(".close").on("click", function () {
			modal.style("display", "none");
		});
	</script>
</body>

</html>
