<!doctype html>
<html>

<head>
	<title>Analysis Flame Graph</title>

	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1" />

	<script src="assets/d3.v7.min.js"></script>

<body>
	<div class="box">
		<header class="row header">
			<img src="https://raw.githubusercontent.com/lisa-analyzer/lisa/master/logo.png" alt="LiSA logo" />
			<h1>Analysis Flame Graph</h1>
			<input id="search" type="text" class="searchbar" placeholder="Search node..." />
			<input id="next" type="button" value="Next" class="button" disabled />
			<input id="prev" type="button" value="Previous" class="button" disabled />
			<button id="centerButton" class="button">Reset zoom &amp; recenter</button>
			<button id="legendButton" class="button">Legend</button>
		</header>
		<div id="legend" class="modal">
			<div class="modal-content">
				<span class="close">&times;</span>
				<b>Interprocedural event: <font color="red">red</font></b>
				<b>Fixpoint event: <font color="blue">blue</font></b>
				<b>Analysis event: <font color="green">green</font></b>
				<b>Domain event: <font color="#d3d609">yellow</font></b>
				<b>The lighter the color, the shorter the execution time</b>
			</div>
		</div>
		<div id="heatmap-chart"></div>
		<div class="heatmap-tooltip" id="heatmap-tooltip"></div>
	</div>

ren\":[],\"end_ns\":\"96519464\",\"start_ns\":\"96439697\",\"text\":\"Traversal of [ positive = identity(a, one) ] ---> [ minusone = -1 ]\"},{\"children\":[{\"children\":[],\"end_ns\":\"96559574\",\"start_ns\":\"96542951\",\"text\":\"Semantics of -1\"},{\"children\":[],\"end_ns\":\"96587974\",\"start_ns\":\"96562437\",\"text\":\"Semantics of minusone\"}],\"end_ns\":\"96686091\",\"start_ns\":\"96540465\",\"text\":\"Semantics of minusone = -1\"},{\"children\":[],\"end_ns\":\"96787191\",\"start_ns\":\"96749216\",\"text\":\"Traversal of [ minusone = -1 ] ---> [ negative = identity(a, minusone) ]\"},{\"children\":[{\"children\":[{\"children\":[],\"end_ns\":\"96853664\",\"start_ns\":\"96822198\",\"text\":\"Semantics of a\"},{\"children\":[],\"end_ns\":\"96880453\",\"start_ns\":\"96856083\",\"text\":\"Semantics of minusone\"},{\"children\":[{\"children\":[{\"children\":[],\"end_ns\":\"99543352\",\"start_ns\":\"99363419\",\"text\":\"Semantics of 1\"},{\"children\":[],\"end_ns\":\"99810499\",\"start_ns\":\"99565115\",\"text\":\"Semantics of i3\"}],\"end_ns\":\"100206408\",\"start_ns\":\"99328878\",\"text\":\"Semantics of i3 = 1\"},{\"children\":[],\"end_ns\":\"100430835\",\"start_ns\":\"100316596\",\"text\":\"Traversal of [ i3 = 1 ] ---> [ return i ]\"},{\"children\":[{\"children\":[],\"end_ns\":\"100498439\",\"start_ns\":\"100463846\",\"text\":\"Semantics of i\"}],\"end_ns\":\"100609052\",\"start_ns\":\"100461057\",\"text\":\"Semantics of return i\"}],\"end_ns\":\"100638577\",\"start_ns\":\"99192744\",\"text\":\"Fixpoint of untyped A::identity(A*, untyped)\"}],\"end_ns\":\"101456435\",\"start_ns\":\"96819431\",\"text\":\"Semantics of identity(a, minusone)\"},{\"children\":[],\"end_ns\":\"101500609\",\"start_ns\":\"101461914\",\"text\":\"Semantics of negative\"}],\"end_ns\":\"101591918\",\"start_ns\":\"96817269\",\"text\":\"Semantics of negative = identity(a, minusone)\"},{\"children\":[],\"end_ns\":\"101754995\",\"start_ns\":\"101670005\",\"text\":\"Traversal of [ negative = identity(a, minusone) ] ---> [ top = helper(this, one, a) ]\"},{\"children\":[{\"children\":[{\"children\":[],\"end_ns\":\"101820316\",\"start_ns\":\"101792127\",\"text\":\"Semantics of this\"},{\"children\":[],\"end_ns\":\"101845641\",\"start_ns\":\"101822625\",\"text\":\"Semantics of one\"},{\"children\":[],\"end_ns\":\"101874160\",\"start_ns\":\"101847024\",\"text\":\"Semantics of a\"},{\"children\":[{\"children\":[{\"children\":[{\"children\":[],\"end_ns\":\"104719236\",\"start_ns\":\"104681287\",\"text\":\"Semantics of dispatcher\"},{\"children\":[],\"end_ns\":\"104770194\",\"start_ns\":\"104721927\",\"text\":\"Semantics of i\"},{\"children\":[{\"children\":[{\"children\":[],\"end_ns\":\"107006728\",\"start_ns\":\"106869063\",\"text\":\"Semantics of 1\"},{\"children\":[],\"end_ns\":\"107154817\",\"start_ns\":\"107023937\",\"text\":\"Semantics of i3\"}],\"end_ns\":\"107257298\",\"start_ns\":\"106841067\",\"text\":\"Semantics of i3 = 1\"},{\"children\":[],\"end_ns\":\"107356951\",\"start_ns\":\"107313332\",\"text\":\"Traversal of [ i3 = 1 ] ---> [ return i ]\"},{\"children\":[{\"children\":[],\"end_ns\":\"107412036\",\"start_ns\":\"107377533\",\"text\":\"Semantics of i\"}],\"end_ns\":\"107493720\",\"start_ns\":\"107375021\",\"text\":\"Semantics of return i\"}],\"end_ns\":\"107529995\",\"start_ns\":\"106662084\",\"text\":\"Fixpoint of untyped A::identity(A*, untyped)\"}],\"end_ns\":\"108037425\",\"start_ns\":\"104679940\",\"text\":\"Semantics of identity(dispatcher, i)\"}],\"end_ns\":\"108406206\",\"start_ns\":\"104676822\",\"text\":\"Semantics of return identity(dispatcher, i)\"}],\"end_ns\":\"108488712\",\"start_ns\":\"104578848\",\"text\":\"Fixpoint of untyped tests::helper(tests*, untyped, untyped)\"}],\"end_ns\":\"109310716\",\"start_ns\":\"101790354\",\"text\":\"Semantics of helper(this, one, a)\"},{\"children\":[],\"end_ns\":\"109563417\",\"start_ns\":\"109349319\",\"text\":\"Semantics of top\"}],\"end_ns\":\"109893248\",\"start_ns\":\"101787796\",\"text\":\"Semantics of top = helper(this, one, a)\"},{\"children\":[],\"end_ns\":\"110096935\",\"start_ns\":\"110009236\",\"text\":\"Traversal of [ top = helper(this, one, a) ] ---> [ ret ]\"},{\"children\":[],\"end_ns\":\"110156568\",\"start_ns\":\"110138998\",\"text\":\"Semantics of ret\"}],\"end_ns\":\"110240958\",\"start_ns\":\"28089544\",\"text\":\"Fixpoint of untyped tests::main(tests*)\"}],\"end_ns\":\"111427053\",\"start_ns\":\"815142\",\"text\":\"Program-wide fixpoint iteration 1\"}],\"end_ns\":\"111458220\",\"start_ns\":\"0\",\"text\":\"Program-wide fixpoint\"}";
		/*]]>*/

		// flatten tree
		const nodes = [];
		function walk(node, depth = 0) {
			const text = String(node.text);
			const start = Number(node.start_ns);
			const end = Number(node.end_ns);
			if (!Number.isFinite(start) || !Number.isFinite(end) || end < start) {
				console.log("Discarding data at depth " + depth + " (" + text + "): invalid start or end time. Graph will be incomplete.");
				console.log("start: " + start + ", end: " + end);
				return;
			}

			const duration = end - start;
			let kind;
			if (text.startsWith("Analysis:")) kind = "Analysis";
			else if (text.match(/^[a-zA-Z0-9_]+:/)) kind = "Domain";
			else if (text.toLowerCase().includes("fixpoint")) kind = "Interprocedural";
			else kind = "Fixpoint";

			nodes.push({text, start, end, duration, kind, depth});
			for (const c of node.children || []) walk(c, depth + 1);
		}
		walk(JSON.parse(graph));

		// layout
		const rowHeight = 22;
		const width = window.innerWidth;
		const height = window.innerHeight;
		const minTime = d3.min(nodes, d => d.start);
		const maxTime = d3.max(nodes, d => d.end);
		const xScale = d3.scaleLinear()
			.domain([minTime, maxTime])
			.range([0, width]);

		// SVG & zoom
		const svg = d3.select("#heatmap-chart")
			.append("svg")
			.attr("width", width)
			.attr("height", height);
		const zoomLayer = svg.append("g");
		const zoom = d3.zoom()
			.scaleExtent([0.1, 50])
			.on("zoom", (event) => {
				zoomLayer.attr("transform", event.transform);
				updateLabels();
			});
		svg.call(zoom);

		// draw nodes
		const tooltip = d3.select("#heatmap-tooltip");
		function showTooltip(event, d) {
			tooltip
				.style("opacity", 1)
				.html(`<b>${d.text}</b><br/>${(d.duration / 1e6).toFixed(2)} ms<br/>Kind: ${d.kind}`);

			moveTooltip(event);
		}
		function moveTooltip(event) {
			const pad = 12;
			const w = tooltip.node().offsetWidth;
			const h = tooltip.node().offsetHeight;

			let x = event.pageX + pad;
			let y = event.pageY + pad;

			if (x + w > window.innerWidth) x = event.pageX - w - pad;
			if (y + h > window.innerHeight) y = event.pageY - h - pad;

			tooltip.style("left", x + "px").style("top", y + "px");
		}
		function hideTooltip() {
			tooltip.style("opacity", 0);
		}
		const categoryHue = {
			Interprocedural: 0, // red
			Fixpoint: 210,      // blue
			Analysis: 120,      // green
			Domain: 60,         // yellow
			unknown: 0
		};
		const durationByKind = d3.group(nodes, d => d.kind);
		const scalesByKind = new Map(
			Array.from(durationByKind, ([kind, arr]) => [
				kind,
				d3.scaleLinear()
					.domain(d3.extent(arr, d => d.duration))
					.range([90, 40])
			])
		);
		function nodeColor(d) {
			const hue = categoryHue[d.kind] ?? categoryHue.unknown;
			const scale = scalesByKind.get(d.kind);
			return `hsl(${hue}, 70%, ${scale(d.duration)}%)`;
		}
		const rects = zoomLayer.selectAll("rect")
			.data(nodes)
			.enter()
			.append("rect")
			.attr("class", "heatmap-node")
			.attr("x", d => xScale(d.start))
			.attr("y", d => d.depth * rowHeight)
			.attr("width", d => xScale(d.end) - xScale(d.start))
			.attr("height", rowHeight - 2)
			.attr("fill", nodeColor)
			.on("mouseenter", showTooltip)
			.on("mousemove", moveTooltip)
			.on("mouseleave", hideTooltip);

		// labels (elided)
		const labels = zoomLayer.selectAll("text")
			.data(nodes)
			.enter()
			.append("text")
			.attr("class", "heatmap-label")
			.attr("x", d => xScale(d.start) + 4)
			.attr("y", d => d.depth * rowHeight + rowHeight * 0.7)
			.text(d => d.text)
			.on("mouseenter", showTooltip)
			.on("mousemove", moveTooltip)
			.on("mouseleave", hideTooltip);
		labels.each(function (d) {
			d._textWidth = this.getBBox().width;
		});

		// Hide labels that don't fit
		function updateLabels() {
			labels.each(function (d) {
				const text = d3.select(this);
				const rectScreenWidth = xScale(d.end) - xScale(d.start);
				text.style("display", d._textWidth + 6 < rectScreenWidth ? null : "none");
			});
		}
		updateLabels();

		// search
		d3.select("#search").node().value = "";
		var hits = [];
		var hit = -1;
		function centerToSearch() {
			rects.classed("heatmap-highlight", false);
			const idx = hits[hit];
			rects.filter((_, j) => j === idx).classed("heatmap-highlight", true);

			const n = nodes[idx];
			const cx = (xScale(n.start) + xScale(n.end)) / 2;
			const cy = n.depth * rowHeight;

			svg.transition().duration(300).call(
				zoom.transform,
				d3.zoomIdentity
					.translate(width / 2 - cx, height / 2 - cy)
					.scale(1.5)
			);
		}
		d3.select("#search").on("input", function (e) {
			var query = e.target.value.toLowerCase();
			hits = [];
			if (query !== "")
				nodes.forEach((n, i) => {
					if (n.text.toLowerCase().includes(query)) hits.push(i);
				});
			rects.classed("heatmap-highlight", false);
			if (query === "" || hits.length == 0) {
				hit = -1;
				d3.select("#next").attr("disabled", true);
				d3.select("#prev").attr("disabled", true);
				d3.select(this).classed("no-results", true);
			} else {
				hit = 0;
				d3.select("#next").attr("disabled", null);
				d3.select("#prev").attr("disabled", null);
				d3.select(this).classed("no-results", false);
				centerToSearch();
			}
		});
		d3.select("#next").on("click", function (e) {
			if (hit != -1) {
				hit = (hit + 1) % hits.length;
				centerToSearch();
			}
		});
		d3.select("#prev").on("click", function (e) {
			if (hit != -1) {
				hit = (hit - 1 + hits.length) % hits.length;
				centerToSearch();
			}
		});

		// recenter button
		d3.select("#centerButton").on("click", function () {
			svg.transition().duration(400).call(
				zoom.transform,
				d3.zoomIdentity
			);
		});

		/* Legend modal */
		var modal = d3.select("#legend").on("click", function () {
			d3.select(this).style("display", "none");
		});
		var btn = d3.select("#legendButton").on("click", function () {
			modal.style("display", "block");
		});
		var span = d3.select(".close").on("click", function () {
			modal.style("display", "none");
		});
	</script>
</body>

</html>
